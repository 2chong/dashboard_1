<div style="width: 1440px; height: 920px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F6FA; color: #202224; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 14px">
<div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #5E6676"><div style="width: 520px;  max-height: 890px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F6FA; border-radius: 18px; box-shadow: 0 24px 60px rgba(16,24,40,0.35); overflow: hidden"><div style="padding: 14px 16px 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #FFFFFF; border-bottom: 1px solid #E3E6EC"><div style="display: flex; align-items: center; gap: 10px"><h1 style="margin: 0; font-size: 18px; font-weight: 700">오경보 신고</h1></div><button aria-label="닫기" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #F5F6FA; color: #5F6775; border: 0; border-radius: 22px; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></button></div><div style="flex-grow: 1; min-height: 0; padding: 18px 24px; display: flex; flex-direction: column; gap: 14px"><div style="display: flex; flex-direction: column; gap: 14px; "><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5F6775"><span>알람</span><span style="height: 38px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; background: #F1F4F9; color: #202224; border-radius: 10px; font-size: 13px">외륜 연삭기 1호기 주축 온도 상한 초과</span></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5F6775"><span>오경보 사유<span aria-hidden="true" style="color: #D92D20"> *</span></span><select style="width: 100%; height: 38px; padding: 0 10px; background: #FFFFFF; color: #202224; border: 1px solid #B9C4D4; border-radius: 10px; font-family: inherit; font-size: 13px"><option>센서 오작동</option><option>기준값이 맞지 않음</option><option>점검이나 시운전 중 발생</option><option>기타</option></select></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5F6775"><span>상세 내용</span><textarea style="width: 100%; height: 64px; box-sizing: border-box; padding: 10px 12px; background: #FFFFFF; color: #202224; border: 1px solid #B9C4D4; border-radius: 10px; font-family: inherit; font-size: 13px; resize: none">온도 센서 접촉 불량</textarea></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5F6775"><span>신고자</span><span style="height: 38px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; background: #F1F4F9; color: #202224; border-radius: 10px; font-size: 13px">이서연</span></label><div style="box-sizing: border-box; padding: 10px 14px; display: flex; align-items: center; gap: 10px; background: #FDECEA; color: #D92D20; border-radius: 10px; font-size: 13px"><span style="display: flex; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"></path><path d="M12 10v5"></path><path d="M12 18v.5"></path></svg></span><span>신고하면 이 알람은 조치 없이 종료되고 되돌릴 수 없음</span></div></div></div><div style="padding: 14px 24px; display: flex; justify-content: flex-end; gap: 8px; background: #FFFFFF; border-top: 1px solid #E3E6EC"><button style=" height: 38px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 18px; border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; background: #FFFFFF; color: #002C5F; border: 1px solid #B9C4D4">취소</button><button style=" height: 38px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 18px; border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; background: #D92D20; color: #ffffff; bord

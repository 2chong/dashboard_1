<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회원가입 신청 완료</title>
<meta name="viewport" content="width=1440">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#002C5F}a:hover{color:#001A3A}
</style>
</head>
<body>
<div style="width: 1440px; height: 810px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F6FA; color: #202224; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 14px">
<div style="flex-grow: 1; display: flex; align-items: center; justify-content: center"><div style="width: 400px; box-sizing: border-box; padding: 40px 32px; background: #ffffff; border-radius: 16px; box-shadow: 0 2px 12px rgba(16,24,40,0.06)"><div style="display: flex; flex-direction: column; gap: 20px; "><div style="display: flex; flex-direction: column; align-items: center; gap: 12px"><span style="width: 120px; height: 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1px dashed #98A2B3; border-radius: 4px; font-size: 12px">회사 로고</span><h1 style="margin: 0; font-size: 22px; font-weight: 700">회원가입</h1></div><div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0"><div style="font-size: 16px; font-weight: 700">가입 신청이 접수되었습니다</div><ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5F6775"><li style="margin: 0">시스템관리자가 승인하면 로그인할 수 있습니다</li><li style="margin: 0">승인 결과는 카카오톡으로 알려 드립니다</li></ul></div><button style="width: 100%; height: 38px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 18px; border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; background: #002C5F; color: #ffffff; border: 1px solid #002C5F">로그인 화면으로</button></div></div></div>
</div>
</body>
</html>

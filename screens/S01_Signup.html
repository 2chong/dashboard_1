<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회원가입</title>
<meta name="viewport" content="width=1440">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#002C5F}a:hover{color:#001A3A}
</style>
</head>
<body>
<div style="width: 1440px; height: 810px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F6FA; color: #202224; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 14px">
<div style="flex-grow: 1; display: flex; align-items: center; justify-content: center"><div style="width: 640px; box-sizing: border-box; padding: 36px 32px; background: #ffffff; border-radius: 16px; box-shadow: 0 2px 12px rgba(16,24,40,0.06)"><div style="display: flex; flex-direction: column; gap: 20px; "><div style="display: flex; flex-direction: column; align-items: center; gap: 12px"><span style="width: 120px; height: 40px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1px dashed #98A2B3; border-radius: 4px; font-size: 12px">회사 로고</span><h1 style="margin: 0; font-size: 22px; font-weight: 700">회원가입</h1></div><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5F6775"><span>아이디<span aria-hidden="true" style="color: #D92D20"> *</span></span><input type="text" value="" placeholder="아이디" style="width: 100%; height: 38px; box-sizing: border-box; padding: 0 12px; background: #FFFFFF; color: #202224; border: 1px solid #B9C4D4; border-radius: 10px; font-family: inherit; font-size: 13px"><span style="font-size: 11px; color: #5F6775">영문 소문자와 숫자 4자 이상 20자 이하</span></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5F6775"><span>이름<span aria-hidden="true" style="color: #D92D20"> *</span></span><input type="text" value="" placeholder="이름" style="width: 100%; height: 38px; box-sizing: border-box; padding: 0 12px; background: #FFFFFF; color: #202224; border: 1px solid #B9C4D4; border-radius: 10px; font-family: inherit; font-size: 13px"></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5F6775"><span>비밀번호<span aria-hidden="true" style="color: #D92D20"> *</span></span><input type="password" value="" placeholder="비밀번호" style="width: 100%; height: 38px; box-sizing: border-box; padding: 0 12px; background: #FFFFFF; color: #202224; border: 1px solid #B9C4D4; border-radius: 10px; font-family: inherit; font-size: 13px"><span style="font-size: 11px; color: #5F6775">영문과 숫자와 특수문자를 포함한 8자 이상</span></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5F6775"><span>비밀번호 확인<span aria-hidden="true" style="color: #D92D20"> *</span></span><input type="password" value="" placeholder="비밀번호 확인" style="width: 100%; height: 38px; box-sizing: border-box; padding: 0 12px; background: #FFFFFF; color: #202224; border: 1px solid #B9C4D4; border-radius: 10px; font-family: inherit; font-size: 13px"></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #5F6775"><span>휴대전화 번호<span aria-hidden="true" style="color: #D92D20"> *</span></span><input type="text" value="" placeholder="010-0000-0000" style="width: 100%; height: 38px; box-sizing: border-box; padding: 0 12px; background: #FFFFFF; color: #202224; border: 1px solid #B9C4D4; border-radius: 10px; font-family: inherit; font-size: 13px"><span style="font-size: 11px; color: #5F6775">카카오톡 알림을 받을 번호</span></label></div><button style="width: 100%; height: 38px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 18px; border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; background: #002C5F; color: #ffffff; border: 1px solid #002C5F">가입 신청</button><div style="display: flex; justify-content: center; gap: 6px; font-size: 13px; color: #5F6775">이미 계정이 있으면<a href="#" style="font-weight: 700">로그인</a></div></div></div></div>
</div>
</body>
</html>
